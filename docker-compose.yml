services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - db
    # SEED_DEMO_DATA is opt-in (not tied to APP_ENV) because the "development"
    # database can be a real production import (see db:reconcile-legacy-migrations) —
    # auto-seeding on every boot would silently mix fake demo rows into real data.
    command: sh -c "composer install --no-interaction && php artisan migrate --force && if [ \"$$SEED_DEMO_DATA\" = true ]; then php artisan db:seed --force; fi && php artisan serve --host=0.0.0.0 --port=8000"

  vite:
    image: node:20
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: winetwork_main
      MARIADB_ROOT_PASSWORD: 426620
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # .env already points MAIL_HOST at "mailpit" (a fake SMTP catcher for local
  # dev, so no real emails ever leave this machine) but no such service
  # existed — any code path that sends mail synchronously (not queued) was
  # failing with a DNS resolution error. Web UI to view "sent" emails at
  # http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  vendor:
  node_modules:
  db_data:
